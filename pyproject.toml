[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fire-avoidance-robot"
version = "0.1.0"
description = "Local mapping and path planning for an Elegoo robot with a Raspberry Pi"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
hardware = ["opencv-python>=4.8,<5", "pyserial>=3.5,<4"]
camera = ["pyrealsense2>=2.54,<3"]

[project.scripts]
firebot = "firebot.cli:main"

[tool.setuptools.packages.find]
include = ["firebot*"]
